task: teacher

# test_problems: kleene
test_problems_path: ./extrinsic/propositional-logic.p
defaults:
    - _self_
    - agent: mcts-lm
    - theory: groups

iterations: 5
n_conjectures: 200

# Multiprocessing and GPU settings
num_gpus: 4  # Number of GPUs to use
num_workers_per_gpu: 2  # Workers per GPU (reduce if you see memory issues)
timeout_per_problem: 150  # Timeout in seconds for each proof search

# Add these environment variables to your launch script:
# export PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
# export CUDA_LAUNCH_BLOCKING=1  # For debugging only, remove in production

num_eval_workers: 6
num_workers: 6
seed: 42

difficulty_buckets:
    - hard: 20
    - easy: 50
    - triv: 100

train_policy_on_hindsight_examples: true
freeze_conjecturer: false

# Tactic induction parameters
induce_tactics: false  # Whether to induce tactics from proofs
max_tactics: 5  # Maximum number of tactics to induce per iteration
min_tactic_occurrences: 3  # Minimum number of occurrences for a tactic to be considered
use_induced_tactics: false  # Whether to add the induced tactics to the agent's action space

job:
    wandb_project: minimo
    name: test_full_tactics

hydra:
    job:
        chdir: true
    run:
        dir: /network/scratch/m/moksh.jain/minimo_experiments/${job.name}/